name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # actions:write permite borrar artefactos obsoletos de este mismo run:
      # al re-ejecutar un run fallido, cada intento vuelve a subir un
      # artefacto "github-pages" y deploy-pages v4 falla con
      # "Multiple artifacts named github-pages". Se limpian antes de subir.
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /nueva-pestana

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Limpiar artefactos "github-pages" previos de este run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts.filter((a) => a.name === 'github-pages')) {
              core.info(`Eliminando artefacto obsoleto #${artifact.id} (${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Si otro despliegue está en curso (p. ej. tras re-ejecutar un run),
        # GitHub responde 400 "due to in progress deployment". No marcamos el
        # job como fallido todavía: esperamos y reintentamos una vez.
        continue-on-error: true

      - name: Esperar a que se libere el despliegue anterior
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Reintentar despliegue
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
